<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Akshay Yadav — Full-Stack Developer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d0d0d;--surface:#141414;--fg:#ecebe6;--muted:#8d8d88;--border:#242424;--accent:#7fb7a4;
--sans:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;--mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
--s1:8px;--s2:16px;--s3:24px;--s4:48px;--s5:96px;--s6:160px;--r:4px;
--ease:cubic-bezier(.22,.61,.36,1);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f6f5f1;--surface:#eceae4;--fg:#161614;--muted:#6b6b66;--border:#dcdad3;--accent:#2f6f5c}}
:root[data-theme="dark"]{--bg:#0d0d0d;--surface:#141414;--fg:#ecebe6;--muted:#8d8d88;--border:#242424;--accent:#7fb7a4}
:root[data-theme="light"]{--bg:#f6f5f1;--surface:#eceae4;--fg:#161614;--muted:#6b6b66;--border:#dcdad3;--accent:#2f6f5c}
html{height:100%;scroll-behavior:smooth;scroll-padding-top:calc(72px + env(safe-area-inset-top,0px))}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100%;background:var(--bg);color:var(--fg);font:400 17px/1.65 var(--sans);-webkit-font-smoothing:antialiased;
background-image:radial-gradient(color-mix(in srgb,var(--fg) 7%,transparent) 1px,transparent 1px);background-size:32px 32px}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:2px}
.wrap{max-width:1180px;margin:0 auto;padding:0 clamp(20px,5vw,48px)}
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:var(--s3)}
.mono{font-family:var(--mono);font-size:12.5px;color:var(--muted);letter-spacing:.02em}
.link{color:var(--fg);border-bottom:1px solid var(--border);padding-bottom:2px;transition:color .3s var(--ease),border-color .3s var(--ease)}
.link:hover{color:var(--accent);border-color:var(--accent)}
.link span{display:inline-block;transition:transform .3s var(--ease)}.link:hover span{transform:translateX(4px)}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:color-mix(in srgb,var(--bg) 92%,transparent);border-bottom:1px solid var(--border)}
nav{display:flex;justify-content:space-between;align-items:center;height:60px}
nav b{font-weight:800;letter-spacing:.04em;font-size:15px}
nav ul{display:flex;gap:var(--s3);list-style:none;margin:0;padding:0;font-size:14px}
nav ul a{color:var(--muted);transition:color .25s}nav ul a:hover,nav ul a.on{color:var(--accent)}
@media(max-width:640px){nav ul{gap:14px;font-size:13px}.hide-s{display:none}}
section{padding:var(--s5) 0;border-top:1px solid var(--border)}
h1,h2,h3{margin:0;line-height:1.05;letter-spacing:-.03em}
h2{font-size:clamp(28px,4vw,44px);font-weight:600}
.hero{border:0;min-height:calc(100svh - 60px);display:flex;align-items:center;padding:var(--s5) 0}
.hero h1{font-size:clamp(52px,10vw,132px);font-weight:800;letter-spacing:-.05em}
.hero .role{font-size:clamp(18px,2vw,24px);color:var(--muted);margin:var(--s2) 0 var(--s4)}
.hero p{max-width:34ch;font-size:clamp(20px,2.4vw,28px);line-height:1.35;letter-spacing:-.01em;margin:0 0 var(--s4)}
.cta{display:flex;gap:var(--s2);flex-wrap:wrap;margin-bottom:var(--s5)}
.btn{padding:12px 20px;border:1px solid var(--border);border-radius:var(--r);font-size:15px;font-weight:500;transition:background .25s,color .25s,border-color .25s}
.btn.pri{background:var(--fg);color:var(--bg);border-color:var(--fg)}.btn.pri:hover{background:var(--accent);border-color:var(--accent)}
.btn:not(.pri):hover{border-color:var(--accent);color:var(--accent)}
.meta{display:flex;gap:var(--s4);flex-wrap:wrap}
.in{opacity:0;transform:translateY(10px);animation:in .7s var(--ease) forwards;animation-delay:calc(var(--i)*90ms)}
@keyframes in{to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){.in{animation:none;opacity:1;transform:none}html{scroll-behavior:auto}*{transition:none!important}}
.lead{grid-column:1/5}.body{grid-column:6/13}
@media(max-width:860px){.lead,.body{grid-column:1/-1}}
.about-t{font-size:clamp(22px,2.6vw,30px);line-height:1.4;letter-spacing:-.015em;margin:0 0 var(--s4)}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:var(--s3);border-top:1px solid var(--border);padding-top:var(--s3)}
.facts dt{margin-bottom:6px}.facts dd{margin:0;color:var(--fg);font-size:15px;line-height:1.5}
.proj{padding:var(--s4) 0;border-top:1px solid var(--border);align-items:center}
.proj:first-of-type{margin-top:var(--s4)}
.vis{grid-column:1/8;aspect-ratio:16/10;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:clamp(20px,3vw,40px);display:flex;flex-direction:column;justify-content:space-between;overflow:hidden;transition:transform .5s var(--ease)}
.vis:hover{transform:scale(1.015)}
.vis .big{font-size:clamp(40px,7vw,88px);font-weight:800;letter-spacing:-.05em;line-height:1;color:var(--border)}
.txt{grid-column:9/13}
.proj.rev .vis{grid-column:6/13;grid-row:1}.proj.rev .txt{grid-column:1/5;grid-row:1}
.proj.full .vis{grid-column:1/-1;aspect-ratio:21/8}.proj.full .txt{grid-column:1/10;margin-top:var(--s3)}
@media(max-width:860px){.vis,.txt,.proj.rev .vis,.proj.rev .txt,.proj.full .vis,.proj.full .txt{grid-column:1/-1;grid-row:auto}}
.txt h3{font-size:clamp(28px,3.2vw,40px);font-weight:600;margin:6px 0 var(--s2)}
.txt p{color:var(--muted);margin:0 0 var(--s2);font-size:16px}
.txt ul{margin:0 0 var(--s3);padding-left:18px;color:var(--muted);font-size:15px}.txt li{margin-bottom:6px}
.links{display:flex;gap:var(--s3);font-size:14px;font-weight:500;white-space:nowrap}
.rows li{list-style:none;display:grid;grid-template-columns:1fr auto;gap:var(--s2);padding:18px 0;border-top:1px solid var(--border);align-items:baseline;transition:padding .3s var(--ease)}
.rows li:hover{padding-left:8px}.rows li:hover strong{color:var(--accent)}
.rows{margin:var(--s3) 0 0;padding:0}.rows strong{font-weight:600;transition:color .25s}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:var(--s4) var(--s3);margin-top:var(--s4)}
.cols ul{list-style:none;margin:8px 0 0;padding:0;font-size:16px}.cols li{padding:4px 0}
.tl{margin-top:var(--s4)}
.tl .row{display:grid;grid-template-columns:200px 1fr;gap:var(--s3);padding:var(--s3) 0;border-top:1px solid var(--border)}
@media(max-width:640px){.tl .row{grid-template-columns:1fr;gap:6px}}
.tl h3{font-size:22px;font-weight:600;letter-spacing:-.02em;margin-bottom:4px}
.tl p{margin:8px 0 0;color:var(--muted);font-size:16px;max-width:62ch}
.contact h2{font-size:clamp(36px,7vw,88px);font-weight:800;letter-spacing:-.045em;margin:var(--s2) 0 var(--s4)}
.contact .mail{font-size:clamp(20px,3vw,32px);letter-spacing:-.02em}
footer{border-top:1px solid var(--border);padding:var(--s4) 0}
.foot{display:flex;justify-content:space-between;gap:var(--s3);flex-wrap:wrap;align-items:center}
.foot nav{height:auto;gap:var(--s3)}
#theme{background:none;border:1px solid var(--border);color:var(--muted);border-radius:var(--r);padding:4px 10px;font:inherit;font-family:var(--mono);font-size:12px;cursor:pointer}
#theme:hover{color:var(--accent);border-color:var(--accent)}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/htm@3.1.1/dist/htm.umd.js"></script>
<script>
const {useState,useEffect}=React;
const html=htm.bind(React.createElement);

// ---- Content (edit here). Replace "#" links with your real URLs. ----
const P={
  email:"akshayyadav12356@gmail.com",
  github:"https://github.com/Akshay448591",
  linkedin:"https://www.linkedin.com/in/akshay-yadav-53211727a/",
  resume:"https://drive.google.com/file/d/1CisWRV3eBbOX6jpUgoXnX3kgCXks3-Gv/view?usp=sharing"
};
const featured=[
 {n:"DonateHere",sub:"Donation & fundraiser platform",
  what:"A fundraising platform where campaigns can collect online donations, with dashboards for donors and admins to track activity.",
  pts:["Secure authentication with role-based dashboards","Stripe payment integration for online donations","Chart.js analytics and admin monitoring of donations and user activity","Cloudinary media uploads behind REST APIs"],
  stack:"React · Node.js · Express.js · MongoDB · Tailwind CSS",tag:"Stripe · Chart.js · Cloudinary",demo:"https://donatehere.onrender.com/",code:"https://github.com/Akshay448591/DonateHere-Project"},
 {n:"TaskJira",sub:"Project & task management for small teams",
  what:"A task tracker for small teams, deployed on Render, where Admins manage projects and Members work through assigned tasks.",
  pts:["9 REST API endpoints covering auth, projects, tasks and dashboard data","JWT authentication, bcryptjs hashing, protected routes and Admin/Member access control","Task lifecycle (Todo, In Progress, Done) with team assignment and overdue tracking","Mongoose schemas for users, projects and tasks; React Router v6 and Context API on the client"],
  stack:"React · Node.js · Express.js · MongoDB · JWT",tag:"JWT · RBAC · Render",demo:"https://taskjira-task-management-platform-live.onrender.com/",code:"https://github.com/Akshay448591/TaskJira-Task-management-platform"},
 {n:"Waste Warrior",sub:"Waste classification system",
  what:"A React frontend connected to a Python API that runs a computer-vision model to classify waste from images.",
  pts:["React 19 and Vite client with Tailwind CSS, Framer Motion animations and React Router","FastAPI backend serving a PyTorch / Ultralytics model, with OpenCV image handling","Firebase integration on the client","Frontend and backend deployed separately"],
  stack:"React · Vite · Tailwind CSS · FastAPI · PyTorch · Ultralytics",tag:"React + FastAPI + PyTorch",demo:"https://waste-warrior-frontend.onrender.com/",code:"https://github.com/Akshay448591/waste-warrior"}
];
const ml=[
 ["Customer Churn Prediction","Logistic Regression on the Telco dataset (7,043 customers): 79.7% accuracy, F1 0.592, with a Streamlit app to test customer profiles.","scikit-learn","https://aiml-project-rollno-2302220100029.streamlit.app/","https://github.com/Akshay448591/AIML-Project-RollNo-2302220100029"],
 ["Predictive Maintenance","LightGBM classifiers for machine failure (ROC-AUC 0.982) and failure type on the AI4I 2020 dataset. Rare failure types are weak, and the write-up says so.","LightGBM","https://aiml-project2-rollno-2302220100029-kxlqxkwmosumrvtsyfkodm.streamlit.app/","https://github.com/Akshay448591/AIML-Project2-RollNo-2302220100029"],
 ["Image Classification","Streamlit app that classifies uploaded images into 1,000 ImageNet categories using a pretrained MobileNetV2.","TensorFlow","https://image-classification-vdbpuybhehftfo6cszvykq.streamlit.app/","https://github.com/Akshay448591/Image-Classification"],
 ["Movie Recommendation","Content-based recommender using TF-IDF and cosine similarity over a 12-title dataset.","scikit-learn","https://movie-recommendation-bhrspwo6adcodsmezwsdqv.streamlit.app/","https://github.com/Akshay448591/Movie-Recommendation"]
];
const skills=[
 ["Frontend",["React.js","React Router","Context API","Tailwind CSS","Chart.js"]],
 ["Backend",["Node.js","Express.js","REST APIs","JWT authentication","Role-based access control"]],
 ["Data",["MongoDB","Mongoose"]],
 ["Languages",["JavaScript (ES6+)","Python","C / C++","HTML5 / CSS3"]],
 ["Tools",["Git & GitHub","Figma","Stripe API","Cloudinary","Render"]]
];
const exp=[
 ["Apr – May 2026","Frontend Development Intern","Campus Scale, MSME Government of India · Remote",
  "Built 10+ responsive pages for a student consultancy platform in HTML and CSS, standardised layouts across college listing pages, and worked on cross-browser compatibility and performance."],
 ["2023 – 2027","B.Tech, Computer Science & Engineering","ITS Engineering College, Greater Noida",
  "Coursework: DSA, DBMS, Operating Systems, Computer Networks, Software Engineering."],
 ["Certifications","AWS Academy Graduate","Amazon Web Services","Also: Data Structures & Algorithms in Python, Infosys Springboard."]
];
const nav=["work","about","experience","contact"];

const Arrow=({children,...p})=>html`<a className="link" ...${p}>${children} <span aria-hidden="true">→</span></a>`;

function Header(){
  const [on,setOn]=useState("");
  useEffect(()=>{
    const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting)setOn(e.target.id)}),{rootMargin:"-40% 0px -55% 0px"});
    nav.forEach(id=>{const el=document.getElementById(id);el&&io.observe(el)});
    return()=>io.disconnect();
  },[]);
  return html`<header><div className="wrap"><nav aria-label="Primary">
    <a href="#top"><b>AKSHAY YADAV</b></a>
    <ul>${nav.map(n=>html`<li key=${n}><a href=${"#"+n} className=${on===n?"on":""} aria-current=${on===n?"true":undefined}>${n[0].toUpperCase()+n.slice(1)}</a></li>`)}
      <li className="hide-s"><a href=${P.github} rel="noopener">GitHub</a></li>
      <li className="hide-s"><a href=${P.linkedin} rel="noopener">LinkedIn</a></li>
      <li className="hide-s"><a href=${P.resume}>Resume</a></li></ul>
  </nav></div></header>`;
}

function Hero(){
  return html`<section className="hero" id="top"><div className="wrap">
    <h1 className="in" style=${{"--i":0}}>Akshay Yadav</h1>
    <div className="role in" style=${{"--i":1}}>Full-stack developer, MERN</div>
    <p className="in" style=${{"--i":2}}>I build web applications end to end, from the interface people use to the systems behind it.</p>
    <div className="cta in" style=${{"--i":3}}>
      <a className="btn pri" href="#work">View work</a>
      <a className="btn" href=${P.resume} target="_blank" rel="noopener">View resume</a>
    </div>
    <div className="meta mono in" style=${{"--i":4}}><span>Based in India</span><span>Final-year B.Tech, 2027</span><span>Open to full-stack roles</span></div>
  </div></section>`;
}

function About(){
  return html`<section id="about"><div className="wrap grid">
    <h2 className="lead">About</h2>
    <div className="body">
      <p className="about-t">I'm a final-year computer science student who builds complete products: authentication, payments, dashboards and the APIs behind them.</p>
      <p style=${{color:"var(--muted)",maxWidth:"60ch",margin:"0 0 40px"}}>Beyond the MERN stack, I've worked on machine-learning projects in Python covering churn prediction, predictive maintenance, image classification and recommendations, each deployed as a Streamlit app. I completed a frontend internship where I built responsive pages for a government-backed student platform.</p>
      <dl className="facts" style=${{margin:0}}>
        <div><dt className="mono">Focus</dt><dd>Full-stack web development, REST APIs, responsive UI</dd></div>
        <div><dt className="mono">Studying</dt><dd>B.Tech CSE, ITS Engineering College, Greater Noida</dd></div>
        <div><dt className="mono">Based</dt><dd>India</dd></div>
      </dl>
    </div></div></section>`;
}

function Project({p,i}){
  const rev=i%2===1;
  return html`<article className=${"proj grid"+(rev?" rev":"")+(i===2?" full":"")}>
    <div className="vis" role="img" aria-label=${p.n+" project summary"}>
      <span className="mono">${p.tag}</span>
      <span className="big" aria-hidden="true">${p.n}</span>
    </div>
    <div className="txt">
      <span className="mono">${"Featured project "+(i+1)+" of "+featured.length}</span>
      <h3>${p.n}</h3>
      <div style=${{color:"var(--fg)",marginBottom:"12px"}}>${p.sub}</div>
      <p>${p.what}</p>
      <ul>${p.pts.map(t=>html`<li key=${t}>${t}</li>`)}</ul>
      <p className="mono" style=${{margin:"0 0 24px"}}>${p.stack}</p>
      <div className="links"><${Arrow} href=${p.demo}>Live demo<//><${Arrow} href=${p.code}>GitHub<//></div>
    </div></article>`;
}

function Work(){
  return html`<section id="work"><div className="wrap">
    <div className="grid"><h2 className="lead">Selected work</h2></div>
    ${featured.map((p,i)=>html`<${Project} key=${p.n} p=${p} i=${i}/>`)}
    <div style=${{marginTop:"64px"}}>
      <h3 style=${{fontSize:"24px",fontWeight:600}}>Machine learning projects</h3>
      <ul className="rows">${ml.map(([n,d,l,u,g])=>html`<li key=${n}><div><strong>${n}</strong> <span className="mono">${l}</span><div style=${{color:"var(--muted)",fontSize:"15px",maxWidth:"64ch"}}>${d}</div></div><div className="links"><a className="link" href=${u} rel="noopener">Live</a><a className="link" href=${g} rel="noopener">GitHub</a></div></li>`)}</ul>
    </div></div></section>`;
}

function Engineering(){
  return html`<section id="engineering"><div className="wrap">
    <h2>Engineering</h2>
    <div className="cols">${skills.map(([h,l])=>html`<div key=${h}><div className="mono">${h}</div><ul>${l.map(s=>html`<li key=${s}>${s}</li>`)}</ul></div>`)}</div>
  </div></section>`;
}

function Experience(){
  return html`<section id="experience"><div className="wrap">
    <h2>Experience and education</h2>
    <div className="tl">${exp.map(([d,t,o,x])=>html`<div className="row" key=${t}>
      <div className="mono">${d}</div>
      <div><h3>${t}</h3><div style=${{color:"var(--accent)",fontSize:"15px"}}>${o}</div><p>${x}</p></div></div>`)}</div>
  </div></section>`;
}

function Contact(){
  return html`<section id="contact" className="contact"><div className="wrap">
    <span className="mono">Contact</span>
    <h2>Have a role or project in mind?</h2>
    <a className="link mail" href=${"mailto:"+P.email}>${P.email} <span aria-hidden="true">→</span></a>
    <div className="links" style=${{marginTop:"32px"}}><${Arrow} href=${P.github} rel="noopener">GitHub<//><${Arrow} href=${P.linkedin} rel="noopener">LinkedIn<//><${Arrow} href=${P.resume}>Resume<//></div>
  </div></section>`;
}

function Footer(){
  const [t,setT]=useState("auto");
  const flip=()=>{const n=t==="auto"?"light":t==="light"?"dark":"auto";setT(n);
    n==="auto"?document.documentElement.removeAttribute("data-theme"):document.documentElement.setAttribute("data-theme",n)};
  return html`<footer><div className="wrap foot">
    <div><b>Akshay Yadav</b><div className="mono">Full-stack developer · © 2026</div></div>
    <button id="theme" onClick=${flip} aria-label=${"Theme: "+t+". Click to change"}>theme: ${t}</button>
  </div></footer>`;
}

function App(){
  return html`<${React.Fragment}><${Header}/><main><${Hero}/><${Work}/><${About}/><${Engineering}/><${Experience}/><${Contact}/></main><${Footer}/><//>`;
}
ReactDOM.createRoot(document.getElementById("root")).render(html`<${App}/>`);
</script>
</body>
</html>
