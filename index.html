:root[data-theme="dark"]{--bg:#0d0d0d;--surface:#141414;--fg:#ecebe6;--muted:#8d8d88;--border:#242424;--accent:#7fb7a4}
:root[data-theme="light"]{--bg:#f6f5f1;--surface:#eceae4;--fg:#161614;--muted:#6b6b66;--border:#dcdad3;--accent:#2f6f5c}
html{height:100%;scroll-behavior:smooth;scroll-padding-top:calc(72px + env(safe-area-inset-top,0px))}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100%;background:var(--bg);color:var(--fg);font:400 17px/1.65 var(--sans);-webkit-font-smoothing:antialiased;
background-image:radial-gradient(color-mix(in srgb,var(--fg) 7%,transparent) 1px,transparent 1px);background-size:32px 32px}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:2px}
.wrap{max-width:1180px;margin:0 auto;padding:0 clamp(20px,5vw,48px)}
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:var(--s3)}
.mono{font-family:var(--mono);font-size:12.5px;color:var(--muted);letter-spacing:.02em}
.link{color:var(--fg);border-bottom:1px solid var(--border);padding-bottom:2px;transition:color .3s var(--ease),border-color .3s var(--ease)}
.link:hover{color:var(--accent);border-color:var(--accent)}
.link span{display:inline-block;transition:transform .3s var(--ease)}.link:hover span{transform:translateX(4px)}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:color-mix(in srgb,var(--bg) 92%,transparent);border-bottom:1px solid var(--border)}
nav{display:flex;justify-content:space-between;align-items:center;height:60px}
nav b{font-weight:800;letter-spacing:.04em;font-size:15px}
nav ul{display:flex;gap:var(--s3);list-style:none;margin:0;padding:0;font-size:14px}
nav ul a{color:var(--muted);transition:color .25s}nav ul a:hover,nav ul a.on{color:var(--accent)}
@media(max-width:640px){nav ul{gap:14px;font-size:13px}.hide-s{display:none}}
section{padding:var(--s5) 0;border-top:1px solid var(--border)}
h1,h2,h3{margin:0;line-height:1.05;letter-spacing:-.03em}
h2{font-size:clamp(28px,4vw,44px);font-weight:600}
.hero{border:0;min-height:calc(100svh - 60px);display:flex;align-items:center;padding:var(--s5) 0}
.hero h1{font-size:clamp(52px,10vw,132px);font-weight:800;letter-spacing:-.05em}
.hero .role{font-size:clamp(18px,2vw,24px);color:var(--muted);margin:var(--s2) 0 var(--s4)}
.hero p{max-width:34ch;font-size:clamp(20px,2.4vw,28px);line-height:1.35;letter-spacing:-.01em;margin:0 0 var(--s4)}
.cta{display:flex;gap:var(--s2);flex-wrap:wrap;margin-bottom:var(--s5)}
.btn{padding:12px 20px;border:1px solid var(--border);border-radius:var(--r);font-size:15px;font-weight:500;transition:background .25s,color .25s,border-color .25s}
.btn.pri{background:var(--fg);color:var(--bg);border-color:var(--fg)}.btn.pri:hover{background:var(--accent);border-color:var(--accent)}
.btn:not(.pri):hover{border-color:var(--accent);color:var(--accent)}
.meta{display:flex;gap:var(--s4);flex-wrap:wrap}
.in{opacity:0;transform:translateY(10px);animation:in .7s var(--ease) forwards;animation-delay:calc(var(--i)*90ms)}
@keyframes in{to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){.in{animation:none;opacity:1;transform:none}html{scroll-behavior:auto}*{transition:none!important}}
.lead{grid-column:1/5}.body{grid-column:6/13}
@media(max-width:860px){.lead,.body{grid-column:1/-1}}
.about-t{font-size:clamp(22px,2.6vw,30px);line-height:1.4;letter-spacing:-.015em;margin:0 0 var(--s4)}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:var(--s3);border-top:1px solid var(--border);padding-top:var(--s3)}
.facts dt{margin-bottom:6px}.facts dd{margin:0;color:var(--fg);font-size:15px;line-height:1.5}
.proj{padding:var(--s4) 0;border-top:1px solid var(--border);align-items:center}
.proj:first-of-type{margin-top:var(--s4)}
.vis{grid-column:1/8;aspect-ratio:16/10;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:clamp(20px,3vw,40px);display:flex;flex-direction:column;justify-content:space-between;overflow:hidden;transition:transform .5s var(--ease)}
.vis:hover{transform:scale(1.015)}
.vis .big{font-size:clamp(40px,7vw,88px);font-weight:800;letter-spacing:-.05em;line-height:1;color:var(--border)}
.vis.has-img{position:relative;padding:0;justify-content:center;align-items:center}
.vis.has-img img{display:block;width:100%;height:100%;object-fit:contain}
.vis .cap{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-between;align-items:flex-end;gap:var(--s2);padding:56px clamp(14px,2vw,24px) clamp(12px,1.6vw,18px);background:linear-gradient(to top,rgba(0,0,0,.82),rgba(0,0,0,.45) 55%,transparent);color:#fff;pointer-events:none}
.vis .cap b{font-size:clamp(15px,1.6vw,20px);font-weight:600;letter-spacing:-.01em;text-shadow:0 1px 8px rgba(0,0,0,.6)}
.vis .cap .mono{color:rgba(255,255,255,.78);text-align:right}
.txt{grid-column:9/13}
.proj.rev .vis{grid-column:6/13;grid-row:1}.proj.rev .txt{grid-column:1/5;grid-row:1}
.proj.full .vis{grid-column:1/-1;aspect-ratio:21/8}.proj.full .txt{grid-column:1/10;margin-top:var(--s3)}
@media(max-width:860px){.vis,.txt,.proj.rev .vis,.proj.rev .txt,.proj.full .vis,.proj.full .txt{grid-column:1/-1;grid-row:auto}}
.txt h3{font-size:clamp(28px,3.2vw,40px);font-weight:600;margin:6px 0 var(--s2)}
.txt p{color:var(--muted);margin:0 0 var(--s2);font-size:16px}
.txt ul{margin:0 0 var(--s3);padding-left:18px;color:var(--muted);font-size:15px}.txt li{margin-bottom:6px}
.links{display:flex;gap:var(--s3);font-size:14px;font-weight:500;white-space:nowrap}
.rows li{list-style:none;display:grid;grid-template-columns:1fr auto;gap:var(--s2);padding:18px 0;border-top:1px solid var(--border);align-items:baseline;transition:padding .3s var(--ease)}
.rows li:hover{padding-left:8px}.rows li:hover strong{color:var(--accent)}
.rows{margin:var(--s3) 0 0;padding:0}.rows strong{font-weight:600;transition:color .25s}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:var(--s4) var(--s3);margin-top:var(--s4)}
.cols ul{list-style:none;margin:8px 0 0;padding:0;font-size:16px}.cols li{padding:4px 0}
.tl{margin-top:var(--s4)}

@media(max-width:640px){.tl .row{grid-template-columns:1fr;gap:6px}}
.tl h3{font-size:22px;font-weight:600;letter-spacing:-.02em;margin-bottom:4px}
.tl p{margin:8px 0 0;color:var(--muted);font-size:16px;max-width:62ch}

.contact .mail{font-size:clamp(20px,3vw,32px);letter-spacing:-.02em}
footer{border-top:1px solid var(--border);padding:var(--s4) 0}
.foot{display:flex;justify-content:space-between;gap:var(--s3);flex-wrap:wrap;align-items:center}
.foot nav{height:auto;gap:var(--s3)}
#theme{background:none;border:1px solid var(--border);color:var(--muted);border-radius:var(--r);padding:4px 10px;font:inherit;font-family:var(--mono);font-size:12px;cursor:pointer}
#theme:hover{color:var(--accent);border-color:var(--accent)}

body{overflow-x:clip}
.contact .mail{overflow-wrap:anywhere}
.btn{min-height:44px;display:inline-flex;align-items:center}
@media(max-width:860px){
 section{padding:var(--s4) 0}
 .hero{padding:var(--s4) 0;min-height:auto}
 .vis,.proj.full .vis{aspect-ratio:auto;min-height:200px;gap:32px}
 .vis.has-img,.proj.full .vis.has-img{min-height:0;gap:0}
 .vis.has-img img{height:auto}
 .vis .big{font-size:clamp(34px,11vw,64px);overflow-wrap:anywhere}
 .txt,.proj.full .txt{margin-top:var(--s2)}
 .proj{gap:var(--s2)}

@media(max-width:640px){

 .hero h1{font-size:clamp(40px,13.5vw,64px)}
 .hero p{font-size:20px;max-width:none}
 .cta{margin-bottom:var(--s4)}
 .cta .btn{flex:1 1 140px;justify-content:center}
 .meta{gap:8px 20px}
 .rows li{grid-template-columns:1fr;gap:10px}
 .rows li:hover{padding-left:0}
 .links{gap:20px}
 .cols{grid-template-columns:1fr 1fr;gap:var(--s3)}
 .facts{grid-template-columns:1fr}
 .foot{flex-direction:column;align-items:flex-start}
 #theme{min-height:44px;padding:8px 14px}
 .contact h2{font-size:clamp(32px,10vw,48px)}
}
@media(max-width:440px){.hide-xs{display:none}nav ul{gap:12px;font-size:12.5px}.cols{grid-template-columns:1fr}}

function Header(){
  const [on,setOn]=useState("");
  useEffect(()=>{
    const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting)setOn(e.target.id)}),{rootMargin:"-40% 0px -55% 0px"});
    nav.forEach(id=>{const el=document.getElementById(id);el&&io.observe(el)});
    return()=>io.disconnect();
  },[]);
  return html`<header><div className="wrap"><nav aria-label="Primary">
    <a href="#top"><b>AKSHAY<span className="hide-xs"> YADAV</span></b></a>
    <ul>${nav.map(n=>html`<li key=${n}><a href=${"#"+n} className=${on===n?"on":""} aria-current=${on===n?"true":undefined}>${n[0].toUpperCase()+n.slice(1)}</a></li>`)}

      <li className="hide-s"><a href=${P.linkedin} rel="noopener">LinkedIn</a></li>
      <li className="hide-s"><a href=${P.resume}>Resume</a></li></ul>
  </nav></div></header>`;
}

function Vis({p}){
  const [bad,setBad]=useState(false);
  if(p.img&&!bad){
    return html`<div className="vis has-img">
      <img src=${p.img} alt=${p.n+" application screenshot"} loading="lazy" decoding="async" onError=${()=>setBad(true)}/>
      <div className="cap"><b>${p.n}</b><span className="mono">${p.tag}</span></div>
    </div>`;
  }
  return html`<div className="vis" role="img" aria-label=${p.n+" project summary"}>
    <span className="mono">${p.tag}</span>
    <span className="big" aria-hidden="true">${p.n}</span>
  </div>`;
}

function Project({p,i}){

}

  return html`<section id="engineering"><div className="wrap">
    <h2>Engineering</h2>
    <div className="cols">${skills.map(([h,l])=>html`<div key=${h}><div className="mono">${h}</div><ul>${l.map(s=>html`<li key=${s}>${s}</li>`)}</ul></div>`)}</div>
  </div></section>`;
}

function Experience(){
  return html`<section id="experience"><div className="wrap">
    <h2>Experience and education</h2>
    <div className="tl">${exp.map(([d,t,o,x])=>html`<div className="row" key=${t}>
      <div className="mono">${d}</div>
      <div><h3>${t}</h3><div style=${{color:"var(--accent)",fontSize:"15px"}}>${o}</div><p>${x}</p></div></div>`)}</div>
    <h3 style=${{fontSize:"24px",fontWeight:600,marginTop:"64px"}}>Certifications</h3>
    <ul className="rows">${certs.map(([t,o,u])=>html`<li key=${t}><div><strong>${t}</strong><div className="mono" style=${{marginTop:"2px"}}>${o}</div></div>${u?html`<div className="links"><a className="link" href=${u} target="_blank" rel="noopener">Verify on Credly <span aria-hidden="true">→</span></a></div>`:null}</li>`)}</ul>
  </div></section>`;
}

function Contact(){
  return html`<section id="contact" className="contact"><div className="wrap">
    <span className="mono">Contact</span>
    <h2>Have a role or project in mind?</h2>
    <a className="link mail" href=${"mailto:"+P.email}>${P.email} <span aria-hidden="true">→</span></a>
    <div className="links" style=${{marginTop:"32px"}}><${Arrow} href=${P.github} rel="noopener">GitHub<//><${Arrow} href=${P.linkedin} rel="noopener">LinkedIn<//><${Arrow} href=${P.resume}>Resume<//></div>
  </div></section>`;
}

function Footer(){
  const [t,setT]=useState("dark");
  const flip=()=>{const n=t==="dark"?"light":"dark";setT(n);document.documentElement.setAttribute("data-theme",n)};
  return html`<footer><div className="wrap foot">
    <div><b>Akshay Yadav</b><div className="mono">Full-stack developer · © 2026</div></div>
    <button id="theme" onClick=${flip} aria-label=${"Switch to "+(t==="dark"?"light":"dark")+" theme"}>${t==="dark"?"Light mode":"Dark mode"}</button>
  </div></footer>`;
}

function App(){
  return html`<${React.Fragment}><${Header}/><main><${Hero}/><${Work}/><${About}/><${Engineering}/><${Experience}/><${Contact}/></main><${Footer}/><//>`;
}
ReactDOM.createRoot(document.getElementById("root")).render(html`<${App}/>`);
</script>
</body>
</html>
